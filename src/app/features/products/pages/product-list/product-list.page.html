<section class="product-list">
  <div class="product-list__toolbar">
    <app-search-box [(value)]="searchTerm" label="Buscar productos" />
    <a class="product-list__add" routerLink="/products/new">Agregar</a>
  </div>

  <div class="product-list__card">
    @if (isLoading()) {
      <p class="product-list__status" role="status">Cargando productos...</p>
    } @else if (errorMessage()) {
      <div class="product-list__error" role="alert">
        <p>{{ errorMessage() }}</p>
        <button class="product-list__retry" type="button" (click)="loadProducts()">
          Reintentar
        </button>
      </div>
    } @else {
      <app-product-table [products]="visibleProducts()" />

      <footer class="product-list__footer">
        <span class="product-list__count" aria-live="polite">{{ resultsCount() }} Resultados</span>
        <app-page-size-select [options]="pageSizeOptions" [(value)]="pageSize" />
      </footer>
    }
  </div>
</section>
